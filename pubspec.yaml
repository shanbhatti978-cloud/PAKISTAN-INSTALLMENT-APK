name: instalment_management_system
description: Pakistan Trader Corporation - Instalment Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.0.0
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.3
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  collection: ^1.18.0

dependency_overrides:
  # Pin app_links to avoid "Could not get unknown property 'flutter'" with AGP
  app_links: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/
